server {
    listen 80;
    server_name port-twin.grapicar.com port-twin.grapicar.studio;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — 존재하지 않는 경로는 index.html로 (React Router 대비)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3D·이미지 등 정적 에셋 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|glb|hdr)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
